<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Gym Dashboard</h1>

    <div class="container">
        <div class="row">
            <div class="card">
                <h2>Total Members</h2>
                <h1 id="members">0</h1>
            </div>

            <div class="card">
                <h2>Total Plans</h2>
                <h1 id="plans">0</h1>
            </div>
        </div>

        <div class="row">
            <div class="card">
                <h2>Total Trainers</h2>
                <h1 id="trainers">0</h1>
            </div>

            <div class="card">
                <h2>Attendance</h2>
                <h1 id="attendance">0</h1>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
